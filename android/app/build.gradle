plugins { id 'com.android.application' }

android {
    namespace 'com.example.ipfinder'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.ipfinder'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // Reuse the desktop extension's page-side OSINT modules and dashboard UI (single source of truth).
    sourceSets.main.assets.srcDirs += "$buildDir/osint-assets"
}

tasks.register('syncOsintAssets', Copy) {
    from(file("${rootDir}/..")) {
        include 'utils/validators.js', 'utils/formatters.js', 'utils/http.js',
                'modules/headers.js', 'modules/security.js', 'modules/technology.js', 'modules/robots.js',
                'modules/sitemap.js', 'modules/metadata.js', 'modules/resources.js', 'modules/report.js',
                'ui/dashboard.js', 'style.css'
    }
    into "$buildDir/osint-assets/osint"
}
preBuild.dependsOn 'syncOsintAssets'

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
